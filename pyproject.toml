[project]
name = "feedtheforge"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx[http2]",
    "brotli",
    "rich",
    "platformdirs",
    "prompt-toolkit",
]

[project.scripts]
feed-the-forge = "program:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[dependency-groups]
dev = [
    "pyinstaller",
]
